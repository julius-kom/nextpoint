name: NextPoint API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start infrastructure
        run: docker compose up -d

      - name: Wait for Keycloak
        run: |
          echo "Waiting for Keycloak..."

          for i in {1..24}; do
            if curl --fail --silent \
              http://localhost:8082/realms/nextpoint/.well-known/openid-configuration \
              > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi

            echo "Keycloak is not ready yet..."
            sleep 5
          done

          echo "Keycloak failed to start within 120 seconds"
          exit 1

      - name: Start NextPoint application
        working-directory: app
        run: |
          ./mvnw spring-boot:run > ../app.log 2>&1 &
          echo $! > ../app.pid

      - name: Wait for NextPoint
        run: |
          echo "Waiting for NextPoint..."

          for i in {1..24}; do
            STATUS=$(curl --silent \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/api/trips || true)

            echo "HTTP status: $STATUS"

            if [ "$STATUS" = "401" ]; then
              echo "NextPoint is ready"
              exit 0
            fi

            sleep 5
          done

          echo "NextPoint failed to start within 120 seconds"
          exit 1

      - name: Run API tests
        working-directory: tests
        run: mvn test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: tests/allure-results
          if-no-files-found: ignore

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextpoint-application-log
          path: app.log
          if-no-files-found: ignore