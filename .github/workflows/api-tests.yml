name: NextPoint API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start infrastructure
        run: docker compose up -d

      - name: Wait for Keycloak
        run: |
          echo "Waiting for Keycloak..."
          until curl --fail --silent \
            http://localhost:8082/realms/nextpoint/.well-known/openid-configuration > /dev/null; do
            sleep 5
          done
          echo "Keycloak is ready"

      - name: Start NextPoint application
        working-directory: app
        run: |
          ./mvnw spring-boot:run > ../app.log 2>&1 &
          echo $! > ../app.pid

      - name: Wait for NextPoint
        run: |
          echo "Waiting for NextPoint..."
          until curl --silent \
            -o /dev/null \
            -w "%{http_code}" \
            http://localhost:8080/api/trips | grep -q "401"; do
            sleep 5
          done
          echo "NextPoint is ready"

      - name: Run API tests
        working-directory: tests
        run: mvn test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: tests/allure-results
          if-no-files-found: ignore

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextpoint-application-log
          path: app.log
          if-no-files-found: ignore