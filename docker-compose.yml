services:
  postgres:
    image: postgres:17
    container_name: nextpoint-postgres
    environment:
      POSTGRES_DB: nextpoint
      POSTGRES_USER: nextpoint
      POSTGRES_PASSWORD: nextpoint
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  wiremock:
    image: wiremock/wiremock:3.13.1
    container_name: nextpoint-wiremock
    ports:
      - "8081:8080"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: nextpoint-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: nextpoint-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/nextpoint-realm.json:/opt/keycloak/data/import/nextpoint-realm.json

volumes:
  postgres-data: